<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#58cc02">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="英语工作台">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2358cc02'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white'>英</text></svg>">
  <link rel="manifest" href="./manifest.json">
  <title>我的英语工作台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; background: #f7f7f7; color: #3c3c3c; padding: 16px; padding-bottom: 80px; max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: #777; font-size: 13px; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card h2 { font-size: 16px; margin-bottom: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 18px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn-primary { background: #58cc02; color: #fff; width: 100%; }
    .btn-outline { background: transparent; border: 1.5px solid #ddd; color: #555; font-size: 13px; padding: 8px 14px; }
    .search-box { display: flex; gap: 8px; }
    .search-box input { flex: 1; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 12px; font-size: 16px; outline: none; }
    .search-box input:focus { border-color: #58cc02; }
    .search-box button { padding: 12px 20px; background: #58cc02; color: #fff; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
    #result-area { margin-top: 14px; font-size: 14px; line-height: 1.7; }
    .phonetic { color: #666; font-size: 14px; margin: 4px 0 10px; }
    .meaning { margin: 8px 0; padding-left: 12px; border-left: 3px solid #58cc02; }
    .meaning b { color: #3a8a00; }
    .synonyms { color: #3a8a00; font-size: 13px; margin-top: 8px; }
    .sentence { background: #f0f7ea; padding: 12px 14px; border-radius: 10px; margin-bottom: 8px; font-size: 14px; line-height: 1.6; }
    .sentence small { color: #888; display: block; margin-top: 4px; }
    .lib-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .lib-item:last-child { border-bottom: none; }
    .lib-word { font-weight: 600; }
    .lib-actions button { background: none; border: none; font-size: 12px; cursor: pointer; color: #999; padding: 2px 4px; }
    .empty { color: #aaa; font-size: 13px; text-align: center; padding: 16px 0; }
    .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0 max(10px, env(safe-area-inset-bottom)); }
    .footer a { color: #999; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; }
    .loading { color: #999; font-size: 13px; }
    .error { color: #c0392b; font-size: 13px; }
  </style>
</head>
<body>
  <h1>📚 我的英语工作台</h1>
  <p class="sub">多邻国 · 查词 · 短句 · 学习库</p>

  <div class="card">
    <h2>🦉 多邻国</h2>
    <p style="font-size:13px;color:#777;margin-bottom:12px;">进度与 App 自动同步</p>
    <a href="https://www.duolingo.com" target="_blank" class="btn btn-primary">打开多邻国网页版</a>
  </div>

  <div class="card">
    <h2>🔍 查单词</h2>
    <div class="search-box">
      <input id="word-input" placeholder="输入英文单词…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button onclick="searchWord()">查询</button>
    </div>
    <div id="result-area"></div>
  </div>

  <div class="card">
    <h2>💬 日常短句</h2>
    <div id="sentence-list"></div>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="nextSentence()">换一句</button>
  </div>

  <div class="card">
    <h2>📖 我的学习库 <span id="lib-count" style="font-weight:400;font-size:13px;color:#999;"></span></h2>
    <div id="library-list"><p class="empty">搜索单词后会自动出现在这里</p></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button class="btn btn-outline" onclick="exportLibrary()">导出备份</button>
      <label class="btn btn-outline" style="cursor:pointer;">导入备份<input type="file" accept=".json" style="display:none;" onchange="importLibrary(event)"></label>
      <button class="btn btn-outline" style="color:#c0392b;border-color:#f5c6cb;" onclick="clearLibrary()">清空</button>
    </div>
  </div>
